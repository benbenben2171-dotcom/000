(async function(){
  'use strict';

  function patchWrapper(wrapper){
    const serviceNeedle = "function service(i,type){";

    const old = "function service(i,type){\n    if(!stateOk())return;const g=state.garage[i],c=safeCarDef(g);if(!g||!c)return;const x=ensureCar(g,c,i);\n    const options={diagnostic:{title:'Диагностика',cost:Math.round(1800+num(c.repair)*.04),gain:5,days:15},maintenance:{title:'Плановое ТО',cost:Math.round(4500+num(c.repair)*.12),gain:12,days:30},deep:{title:'Глубокое обслуживание',cost:Math.round(9000+num(c.repair)*.24),gain:22,days:45}};\n    const o=options[type]||options.maintenance;";
    const guard = "function service(i,type){\n    if(!stateOk())return;const g=state.garage[i],c=safeCarDef(g);if(!g||!c)return;const x=ensureCar(g,c,i);\n    const options={diagnostic:{title:'Диагностика',cost:Math.round(1800+num(c.repair)*.04),gain:5,days:15},maintenance:{title:'Плановое ТО',cost:Math.round(4500+num(c.repair)*.12),gain:12,days:30},deep:{title:'Глубокое обслуживание',cost:Math.round(9000+num(c.repair)*.24),gain:22,days:45}};\n    const o=options[type]||options.maintenance;\n    const hasPrevious=Number(x.lastServiceAt)>0;\n    const dueByTime=Number(x.nextServiceAt)>0 && now()>=Number(x.nextServiceAt);\n    const dueByKm=Number(g.mileage)>=Number(x.nextServiceKm||0);\n    if(hasPrevious && !dueByTime && !dueByKm){toastSafe(`${c.name}: повторное ТО пока не требуется`);return;}";
    if(wrapper.includes(old)) wrapper=wrapper.replace(old,guard);

    const oldBtn='<button type="button" class="btn" data-life-service="${i}" data-life-type="maintenance">🔧 ТО</button>';
    const newBtn='${(()=>{const due=!x.lastServiceAt||now()>=Number(x.nextServiceAt||0)||num(g.mileage)>=num(x.nextServiceKm);return `<button type="button" class="btn" data-life-service="${i}" data-life-type="maintenance" ${due?"":"disabled"}>${due?"🔧 ТО":"✅ ТО выполнено"}</button>`})()}';
    if(wrapper.includes(oldBtn)) wrapper=wrapper.replace(oldBtn,newBtn);

    // Expose the garage inspector before any card can be clicked. The previous version
    // assigned the global only after the inspector was already invoked, so the first
    // card click did nothing.
    const inspectorNeedle='function inspect(i){window.__PEREKUP_GARAGE_INSPECT=inspect;';
    const inspectorFixed='window.__PEREKUP_GARAGE_INSPECT=inspect;function inspect(i){';
    wrapper=wrapper.replace(inspectorNeedle,inspectorFixed);

    const oldRender="saveSafe();try{if(typeof showTab==='function')showTab('garage')}catch(_){};";
    const newRender="saveSafe();try{if(typeof refreshGarageOnly==='function')refreshGarageOnly();else if(typeof showTab==='function')showTab('garage')}catch(_){};";
    if(wrapper.includes(oldRender)) wrapper=wrapper.replace(oldRender,newRender);
    return wrapper;
  }

  function patchSource(source){
    // 1) Delivery flicker: update only the timer, never repaint the whole garage every tick.
    if(!source.includes('function updateDeliveryTimerUI(){')){
      const helper=`function updateDeliveryTimerUI(){
 const box=document.getElementById('garageCards');
 const timer=box?.querySelector('.pendingCard .roadTimer');
 const p=state.pendingDelivery;
 if(timer&&p&&p.mode!=='breakdown')timer.textContent=remainingSec(p.endAt)+' сек.';
}

`;
      if(!source.includes('function tickDelivery(){')) throw new Error('В исходнике не найдена tickDelivery().');
      source=source.replace('function tickDelivery(){',helper+'function tickDelivery(){');
      const oldBlock=" renderGarage();\n}\nfunction startDelivery(){";
      const newBlock=" updateDeliveryTimerUI();\n}\nfunction startDelivery(){";
      if(!source.includes(oldBlock)) throw new Error('Не найден участок tickDelivery() для точечного исправления.');
      source=source.replace(oldBlock,newBlock);
    }

    // 2) Garage-only refresh: don't rebuild hidden market/listing DOM after garage actions.
    if(!source.includes('function refreshGarageOnly(){')){
      const garageRefresh=`function refreshGarageOnly(){
 document.getElementById('money').textContent=fmt(state.money);
 document.getElementById('rep').textContent=state.rep;
 document.getElementById('count').textContent=state.garage.length;
 document.getElementById('sales').textContent=state.sales;
 document.getElementById('profit').textContent=fmt(state.profit);
 document.getElementById('level').textContent=level();
 renderBusinessPulse();
 renderAIDirector();
 renderShowroom();
 const logBox=document.getElementById('log');
 if(logBox)logBox.innerHTML=state.logs.length?state.logs.map(x=>\`<div class="event \${x.type}">\${x.text}</div>\`).join(''):'<div class="muted">Пока ничего не произошло.</div>';
 renderGarage();
 renderTuning();
 renderMarketEvent();
 save();
}
`;
      const anchor='function repair(i){';

      source=source.replace(anchor,garageRefresh+'\n'+anchor);
    }

    // 3) Replace expensive full renders for garage actions.
    const actions=[
      /function issueRepair\(i\)\{([\s\S]*?)save\(\);render\(\);\n\}/,
      /function maskIssue\(i\)\{([\s\S]*?)save\(\);render\(\);\n\}/,
      /function repair\(i\)\{([\s\S]*?)save\(\);render\(\)\}/,
      /function paint\(i\)\{([\s\S]*?)save\(\);render\(\)\}/,
      /function wash\(i\)\{([\s\S]*?)save\(\);render\(\);/

    for(const re of actions){
      source=source.replace(re,m=>m.replace('save();render();','refreshGarageOnly();'));

    if(source.includes(sellButtonOld)){
      source=source.replace(sellButtonOld,sellButtonNew);
    } else {
      // Fallback for the raw source string: replace only the exact button fragment.
      const rawOld='<button type=\"button\" class=\"btn yellow\" data-sell=\"${slot}\">Продать</button>';
      const rawNew='\${g.forSale?\`<button type=\"button\" class=\"btn yellow\" data-sell=\"${slot}\" disabled title=\"Автомобиль уже выставлен на продажу\">🏷️ На продаже</button>\`:\`<button type=\"button\" class=\"btn yellow\" data-sell=\"${slot}\">Продать</button>\`}';
      source=source.replace(rawOld,rawNew);

    source=source.replace("save();render();showTab('garage');toast('Объявление опубликовано. Жди уведомления покупателя')","refreshGarageOnly();toast('Объявление опубликовано. Жди уведомления покупателя')");

    // 5) Robust runtime guard: handle garage sale/maintenance clicks before the original document handlers.

(function(){

  function doLog(msg,type){try{if(typeof logSafe==='function')logSafe(msg,type);else if(typeof log==='function')log(msg,type)}catch(_){}}
  function doSell(i){
    const g=state.garage?.[i],c=typeof carDef==='function'?carDef(g):null;
    if(!g||!c){showToast('Не удалось выставить эту машину');return}
    const listed=!!g.forSale || (state.saleListings||[]).some(x=>x&&String(x.carId)===String(g.id)&&x.active!==false&&x.channel==='market');
    if(listed){showToast('Машина уже выставлена. Ожидай предложения покупателя');syncButtons();return}
    if(g.showroomListed||state.showroom?.listed?.includes(g.id)){showToast('Машина уже выставлена в автосалоне — жди предложения покупателей');return}
    const ts=now();
    g.forSale=true;g.saleChannel='market';g.clientOffers=[];
    state.saleListings=Array.isArray(state.saleListings)?state.saleListings:[];
    state.saleListings.push({id:'sl_'+ts+'_'+Math.random().toString(16).slice(2),carId:g.id,channel:'market',listedAt:ts,nextOfferAt:ts+16000+Math.floor(Math.random()*24000),generatedCount:0,offers:[],active:true});
    doLog('📢 '+c.name+' выставлен на продажу. Машина останется у тебя до тех пор, пока ты не примешь предложение.','neutral');
    doSave();garageRefresh();showToast('Объявление опубликовано. Жди уведомления покупателя');
  }
  function doService(i,type){
    const g=state.garage?.[i],c=typeof carDef==='function'?carDef(g):null;if(!g||!c)return;
    g.garageLife=g.garageLife&&typeof g.garageLife==='object'?g.garageLife:{};
    const x=g.garageLife;
    x.history=Array.isArray(x.history)?x.history:[];
    const hasPrevious=n(x.lastServiceAt)>0;
    const dueByTime=n(x.nextServiceAt)>0&&now()>=n(x.nextServiceAt);
    const dueByKm=n(g.mileage)>=n(x.nextServiceKm);
    if(hasPrevious&&!dueByTime&&!dueByKm){syncButtons();showToast(c.name+': повторное ТО пока не требуется');return}
    const options={maintenance:{title:'Плановое ТО',cost:Math.round(4500+n(c.repair)*.12),gain:12,days:30},diagnostic:{title:'Диагностика',cost:Math.round(1800+n(c.repair)*.04),gain:5,days:15},deep:{title:'Глубокое обслуживание',cost:Math.round(9000+n(c.repair)*.24),gain:22,days:45}};
    const o=options[type]||options.maintenance;
    const canAfford=typeof afford==='function'?afford(o.cost):n(state.money)>=o.cost;
    if(!canAfford){showToast('Не хватает денег на эту работу');return}
    state.money-=o.cost;
    g.extraSpent=n(g.extraSpent)+o.cost;
    g.condition=clamp2(n(g.condition)+o.gain,0,100);

    x.serviceScore=clamp2(n(x.serviceScore)+o.gain*.9,0,100);
    x.lastServiceAt=now();x.lastServiceKm=n(g.mileage);
    x.nextServiceKm=n(g.mileage)+(type==='deep'?22000:type==='maintenance'?15000:8000);
    x.nextServiceAt=now()+o.days*86400000;x.priority='low';
    x.history.push({at:now(),type:'service',title:o.title,text:'Выполнено в гараже. Индекс обслуживания +'+Math.round(o.gain*.9)+'.',cost:o.cost,km:n(g.mileage)});
    x.history=x.history.slice(-30);
    state.rep=n(state.rep)+1;
    doLog('🔧 '+c.name+': '+o.title.toLowerCase()+' за '+(typeof money==='function'?money(o.cost):o.cost+' ₽')+'.','positive');
    doSave();garageRefresh();showToast(c.name+': '+o.title+' завершено');
  }
  document.addEventListener('click',function(e){
    const target=e.target?.closest?.('[data-sell],[data-life-service]');
    if(!target)return;

    e.preventDefault();e.stopImmediatePropagation();

    if(target.dataset.lifeService!==undefined){doService(n(target.dataset.lifeService),target.dataset.lifeType||'maintenance');return}
  },true);
  const oldRender=window.renderGarage;
  if(typeof oldRender==='function'&&!oldRender.__perekupWrapped){
    const wrapped=function(){const r=oldRender.apply(this,arguments);setTimeout(syncButtons,0);return r};
    wrapped.__perekupWrapped=true;window.renderGarage=wrapped;
  }
  const garageBox=document.getElementById('garageCards');
  if(garageBox){
    const obs=new MutationObserver(()=>setTimeout(syncButtons,20));
    obs.observe(garageBox,{childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(syncButtons,50),{once:true});
  else setTimeout(syncButtons,50);
})();
<\/script>`;

    const washUiFix=`<script>
(function(){
  'use strict';
  if(window.__PEREKUP_WASH_UI_FIX_V1)return;
  window.__PEREKUP_WASH_UI_FIX_V1=true;
  function syncWashButtons(){
    try{
      const gs=Array.isArray(state?.garage)?state.garage:[];
      document.querySelectorAll('[data-wash]').forEach(btn=>{
        const i=Number(btn.dataset.wash);
        const g=gs[i];
        if(!g)return;
        const clean=Number(g.dirt||0)<=0;
        const label=clean?'✅ Чисто':'🧼 Мойка';
        btn.disabled=clean || btn.disabled===true && !clean && false;
        btn.textContent=label;
        btn.title=clean?'Автомобиль уже чистый':'Помыть автомобиль';
      });
    }catch(_){ }
  }
  function boot(){
    syncWashButtons();
    const box=document.getElementById('garageCards');
    if(box){
      const obs=new MutationObserver(()=>syncWashButtons());
      obs.observe(box,{childList:true,subtree:true,characterData:true});
    }
    setInterval(syncWashButtons,250);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
  else setTimeout(boot,0);
})();
<\/script>`;

    // Перехватываем только запрос основного движка 777 и меняем исключительно рендер таймера доставки.
    const originalFetch=window.fetch.bind(window);
    window.fetch=async function(input,init){
      const url=typeof input==='string'?input:(input&&input.url)||'';
      const response=await originalFetch(input,init);
      if(url===SOURCE_URL){
        const text=await response.text();
        const fixed=patchSource(text);
        return new Response(fixed,{status:response.status,statusText:response.statusText,headers:response.headers});
      }
      return response;
    };

    status.textContent='Запуск игры с исправленным рендером доставки…';
